# Ensure that the plugin meets the required style guidelines
# Ensure that the frontend builds and its tests pass
# Ensure that the plugin builds correctly (with the built frontend bundles)
# Ensure that the plugin's test suite passes against a real InvenTree instance

name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule: # run every week to catch upstream InvenTree breakage
    - cron: "0 12 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .pre-commit-config.yaml
  RUFF_VERSION: "0.16.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Deps
        run: |
          pip install -U "ruff==${RUFF_VERSION}"
          pip install -U wheel setuptools twine build
      - name: Style Checks
        run: |
          ruff check --preview inventree_mcp
          ruff format --preview --check inventree_mcp
          ruff check --preview --isolated inventree_mcp/tests
          ruff check --isolated dev/*.py dev/authentik/*.py dev/e2e/*.py
      - name: Frontend (lint, test, build)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm run check:bundles
      - name: Upload frontend bundles
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundles
          path: inventree_mcp/static
          # .vite/manifest.json (hashed bundle names) is a hidden file
          include-hidden-files: true
          if-no-files-found: error
      - name: Build Plugin
        run: |
          python -m build
          # The wheel must ship the templates and the built bundles
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for needle in ("inventree_mcp/templates/inventree_mcp/consent.html", "inventree_mcp/static/Groups.js"):
              if needle not in names:
                  sys.exit(f"missing from wheel: {needle}")
          print("wheel contents OK")
          EOF

  integration-tests:
    name: "Integration tests (${{ matrix.inventree-tag }})"
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        inventree-tag: [stable, latest]

    container:
      image: inventree/inventree:${{ matrix.inventree-tag }}
      options: --user root
      env:
        INVENTREE_DB_ENGINE: postgresql
        INVENTREE_DB_NAME: inventree
        INVENTREE_DB_HOST: db
        INVENTREE_DB_PORT: 5432
        INVENTREE_DB_USER: inventree
        INVENTREE_DB_PASSWORD: inventree
        INVENTREE_PLUGINS_ENABLED: True
        INVENTREE_PLUGINS_MANDATORY: inventree-mcp
        INVENTREE_PLUGIN_TESTING: True
        INVENTREE_PLUGIN_TESTING_SETUP: True
        INVENTREE_SITE_URL: http://localhost:8000
        # The membership re-check tests need allauth's OpenID Connect provider installed
        INVENTREE_SOCIAL_BACKENDS: openid_connect

    services:
      db:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: inventree
          POSTGRES_PASSWORD: inventree
          POSTGRES_DB: inventree

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download frontend bundles
        uses: actions/download-artifact@v4
        with:
          name: frontend-bundles
          path: inventree_mcp/static

      - name: Setup InvenTree
        run: |
          cd /home/inventree
          HOME=/root invoke update

      - name: Install Plugin
        run: |
          cd /home/inventree
          # InvenTree's settings.py unconditionally sets TEST_RUNNER to
          # django_slowtests whenever 'manage.py test' is run, but that
          # package isn't part of the base inventree/inventree image.
          HOME=/root pip3 install django_slowtests==1.1.1
          HOME=/root pip3 install -e "$GITHUB_WORKSPACE[test]"
          HOME=/root invoke migrate

      - name: Run Tests
        run: |
          cd /home/inventree/src/backend
          HOME=/root python -m coverage run --rcfile="$GITHUB_WORKSPACE/pyproject.toml" InvenTree/manage.py test inventree_mcp
          HOME=/root python -m coverage xml -i --rcfile="$GITHUB_WORKSPACE/pyproject.toml" -o "$GITHUB_WORKSPACE/coverage.xml"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: inventree/inventree-mcp
          files: coverage.xml
          flags: integration-tests
