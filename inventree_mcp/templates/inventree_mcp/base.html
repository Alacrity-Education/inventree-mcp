<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}InvenTree{% endblock %} · InvenTree</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1d2228; --muted: #5d6670;
      --border: #dde1e6; --accent: #228be6; --accent-text: #ffffff;
      --ok-bg: #e6f4ea; --ok-text: #1e6b34; --warn-bg: #fff4e0; --warn-text: #8a5300;
      --err: #c92a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191d; --card: #1f2329; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #343a42; --accent: #4dabf7; --accent-text: #0b1520;
        --ok-bg: #173323; --ok-text: #8ce0a6; --warn-bg: #3a2c12; --warn-text: #ffcf7a;
        --err: #ff8787;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card);
      font-weight: 600; letter-spacing: .01em;
    }
    main { max-width: 520px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 24px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem;
      font-weight: 600; vertical-align: middle;
    }
    .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
    .notice {
      background: var(--warn-bg); color: var(--warn-text); border-radius: 8px;
      padding: 10px 12px; margin: 0 0 14px; font-size: .9rem;
    }
    ul { margin: 0 0 14px; padding-left: 20px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 16px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    button, .button {
      font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      text-decoration: none; display: inline-block;
    }
    button.primary, .button.primary {
      background: var(--accent); border-color: var(--accent); color: var(--accent-text);
    }
    code { font-size: .85rem; }
    .error-code { color: var(--err); }
  </style>
</head>
<body>
  <header>InvenTree</header>
  <main>
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
